<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Flexbox FATEC</title>
    <link rel="stylesheet" href="aula_07.css">
</head>
<body class="site-container">

    <nav class="navbar">
        <div class="logo">FATEC 2026</div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Sobre</a></li>
            <li><a href="#">Matrícula</a></li>
        </ul>
    </nav>

    <section class="hero">
        <h1>Bem-vindo ao Futuro</h1>
    </section>

    <div class="main-layout">
        <aside class="sidebar">
            <h3>Menu Lateral</h3>
            <ul>
                <li>Dashboard</li>
                <li>Perfil</li>
                <li>Configurações</li>
            </ul>
        </aside>

        <main class="content">
            <h2>Nossos Cursos</h2>
            <div class="card-container">
                <div class="card">ADS</div>
                <div class="card">DSM</div>
                <div class="card">Gestão</div>
                <div class="card">Logística</div>
            </div>
        </main>
    </div>

    <footer class="footer">
        <p>&copy; 2026 FATEC - Todos os direitos reservados</p>
    </footer>

</body>
</html>
