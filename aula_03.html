<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrícula FATEC 2026</title>
</head>
<body>

    <header>
        <h1>Formulário de Matrícula - FATEC</h1>
        <p>Preencha os dados abaixo para iniciar sua jornada tecnológica.</p>
    </header>

    <main>
        <form action="#" method="post" enctype="multipart/form-data">
            
            <fieldset>
                <legend>Dados Pessoais</legend>
                
                <p>
                    <label for="nome">Nome Completo:</label><br>
                    <input type="text" id="nome" name="nome" minlength="5" required>
                </p>

                <p>
                    <label for="email">E-mail:</label><br>
                    <input type="email" id="email" name="email" required>
                </p>

                <p>
                    <label for="nascimento">Data de Nascimento:</label><br>
                    <input type="date" id="nascimento" name="nascimento">
                </p>

                <p>
                    <label for="cpf">CPF (000.000.000-00):</label><br>
                    <input type="text" id="cpf" name="cpf" 
                           pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" 
                           title="Digite o CPF no formato: 000.000.000-00">
                </p>

                <p>
                    <label for="foto">Foto de Perfil:</label><br>
                    <input type="file" id="foto" name="foto" accept="image/*">
                </p>
            </fieldset>

            <fieldset>
                <legend>Dados Acadêmicos</legend>

                <p>
                    <label for="curso">Curso:</label><br>
                    <select id="curso" name="curso">
                        <option value="ads">Análise e Desenvolvimento de Sistemas</option>
                        <option value="ge">Gestão Empresarial</option>
                        <option value="dsm">Desenvolvimento de Software Multiplataforma</option>
                    </select>
                </p>

                <p>
                    Período:<br>
                    <input type="radio" id="manha" name="periodo" value="manha">
                    <label for="manha">Manhã</label>
                    
                    <input type="radio" id="noite" name="periodo" value="noite">
                    <label for="noite">Noite</label>
                </p>

                <p>
                    <input type="checkbox" id="programador" name="programador">
                    <label for="programador">Já programou antes?</label>
                </p>

                <p>
                    <label for="cor">Escolha sua cor favorita (para o crachá):</label><br>
                    <input type="color" id="cor" name="cor" value="#ff0000">
                </p>
            </fieldset>

            <p>
                <label for="obs">Observações:</label><br>
                <textarea id="obs" name="obs" rows="4" cols="50" placeholder="Conte-nos algo relevante..."></textarea>
            </p>

            <button type="submit">Enviar Matrícula</button>
            <button type="reset">Limpar Tudo</button>

        </form>
    </main>

    <footer>
        <p>FATEC 2026 - Departamento de Admissão</p>
    </footer>

</body>
</html>
