<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Tarefas Interativa</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f7f9fc;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .todo-wrapper {
      background: white;
      width: 100%;
      max-width: 450px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }
    h2 { margin-top: 0; color: #333; }
    .search-box, form {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: #4f46e5; }
    button {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      font-weight: 500;
    }
    button:hover { background: #4338ca; }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      background: #f8fafc;
      border-radius: 6px;
      margin-bottom: 8px;
      border-left: 4px solid #cbd5e1;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }
    li:hover { background: #f1f5f9; }
    li.concluida {
      text-decoration: line-through;
      color: #94a3b8;
      background: #f8fafc;
      border-left-color: #10b981;
    }
    .btn-deletar {
      background: #ef4444;
      padding: 4px 8px;
      font-size: 12px;
      border-radius: 4px;
    }
    .btn-deletar:hover { background: #dc2626; }
    .escondido { display: none !important; }
  </style>
</head>
<body>

  <div class="todo-wrapper">
    <h2>Minhas Tarefas</h2>
    
    <div class="search-box">
      <input type="text" id="busca" placeholder="🔍 Buscar tarefa...">
    </div>

    <form id="form-tarefa">
      <input type="text" id="nova-tarefa" placeholder="O que precisa ser feito?" required autocomplete="off">
      <button type="submit">Adicionar</button>
    </form>

    <ul id="lista-tarefas"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
